name: Python package

on:
  push:
    branches: [ "principal" ]
  pull_request:
    branches: [ "principal" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ejecutar script (opcional)
      run: |
        echo "Ejecutando script..."
        # Cambiá esto por tu archivo principal si tenés uno
        # python main.py

    - name: Generar ejecutable (opcional con pyinstaller)
      run: |
        pip install pyinstaller
        # Cambiá main.py por tu archivo real
        pyinstaller --onefile main.py || echo "No se generó ejecutable"

    - name: Subir artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ejecutable
        path: dist/
